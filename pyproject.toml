[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "meterflow"
dynamic = ["version"]
description = "Official Python SDK for MeterFlow — usage-based billing, credit management, and metering."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "MeterFlow", email = "support@meter-flow.com" }]
requires-python = ">=3.10"
keywords = ["meterflow", "billing", "metering", "usage-based", "credits", "entitlements"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "mypy>=1.11",
  "ruff>=0.6",
  "build>=1.2",
]

[project.urls]
Homepage = "https://meter-flow.com"
Documentation = "https://meter-flow.com/guide"
Source = "https://github.com/meterflowio/meterflow-python"
Issues = "https://github.com/meterflowio/meterflow-python/issues"

[tool.hatch.version]
path = "src/meterflow/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/meterflow"]

[tool.hatch.build.targets.sdist]
include = ["src/meterflow", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 140
target-version = "py310"
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
packages = ["meterflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.coverage.run]
source = ["meterflow"]
omit = ["src/meterflow/types.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
